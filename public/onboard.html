<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>RCL – Joining</title>
<link rel="icon" href="favicon.png">
<style>
:root{--ink:#14213D;--soft:#3F4A60;--line:#E3EAF6;--red:#D2001A;--bg:#F6F8FC;--ok:#146C2E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:34px}header b{font-size:17px}header .lang{margin-left:auto;display:flex;gap:6px}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:21px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}
.muted{color:var(--soft);font-size:14.5px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;padding:0;list-style:none}
.steps li{font-size:13.5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;color:var(--soft)}
.steps li.on{border-color:var(--red);color:var(--red);font-weight:600}.steps li.done{background:#EAF7EE;border-color:#BFE3CA;color:var(--ok)}
label{display:block;font-size:14.5px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #CBD5E6;border-radius:10px;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(210,0,26,.18);border-color:var(--red)}
textarea{min-height:76px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
button{font:inherit;border-radius:10px;padding:11px 16px;border:1px solid #CBD5E6;background:#fff;color:var(--ink);cursor:pointer}
button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.sm{padding:6px 10px;font-size:14px}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:3px solid rgba(210,0,26,.35);outline-offset:2px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.err{color:#A80015;background:#FDECEE;border-radius:10px;padding:10px 12px;margin:12px 0 0}
.ok{color:var(--ok);background:#EAF7EE;border-radius:10px;padding:10px 12px;margin:12px 0 0}
.paper{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.paper b{display:block}.paper .st{font-size:13.5px;font-weight:600}.paper .st.have{color:var(--ok)}.paper .st.miss{color:#8A5300}
.policy{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.policy pre{white-space:pre-wrap;font:inherit;max-height:260px;overflow:auto;background:var(--bg);border-radius:8px;padding:10px;margin:8px 0}
.tick{display:flex;gap:10px;align-items:flex-start;font-weight:500}.tick input{width:auto;margin-top:4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div style="display:inline-flex;align-items:center;gap:8px;"><svg width="28" height="28" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="#0A1B44"/><path d="M12 28V12L28 20L12 28Z" fill="#D2001A"/><circle cx="28" cy="20" r="4" fill="#38BDF8"/></svg><b>ONECLICK HRMS · Employee Joining</b></div>
  <span class="lang"><button class="sm" type="button" data-lang="">English</button><button class="sm" type="button" data-lang="mr">मराठी</button><button class="sm" type="button" data-lang="hi">हिंदी</button></span></header>
<main>
  <div class="card" id="ob_msg"><p class="muted">Opening…</p></div>
  <div id="ob_form" hidden>
    <div class="card"><h1 id="ob_hello"></h1><p class="muted" id="ob_until"></p><p class="err" id="ob_back" hidden></p></div>
    <ol class="steps" id="ob_steps"></ol>
    <div class="card" id="ob_step"></div>
  </div>
</main>
<script src="i18n.js"></script>
<script src="onboard.js"></script>
</body>
</html>
